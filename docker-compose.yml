services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: test_website_backend
    restart: unless-stopped
    networks:
      - proxy-net
    environment:
      - NODE_ENV=production
      - PORT=3000

  nginx:
    image: nginx:alpine
    container_name: test_website_nginx
    restart: unless-stopped
    ports:
      - "4333:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - web
    networks:
      - proxy-net

networks:
  proxy-net:
    driver: bridge

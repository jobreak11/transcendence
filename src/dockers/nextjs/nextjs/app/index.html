<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" name="viewport" content="width=device-width,initial-scale=1" />
<title>Transcend 888 - A 42 Transcendence Project</title>
	<style id="style-normalize" type="text/css">
		html {
			font-family: sans-serif;
			-ms-text-size-adjust: 100%;
			-webkit-text-size-adjust: 100%;
		}
		body {
			margin: 0;
		}
		details,
		canvas,
		header,
		footer,
		main,
		menu,
		nav,
		section,
		summary {
			display: block;
		}
		audio,
		/* audio:not([controls]) {
			display: none;
			height: 0;
		} */
		video {
			display: inline-block;
			vertical-align: baseline;
		}
		a {
			background-color: transparent;
		}
		a:active,
		a:hover {
			outline: 0;
		}
		b,
		strong {
			font-weight: bold;
		}
		dfn {
			font-style: italic;
		}
	</style>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<div><h1 class="startheader">Transcend 888</h1></div>
	<div class="centerblock">
		<form id="loginForm">
			<label for="loginEmail">E-mail:</label> <input type="email" id="loginEmail" name="email" required><br>
			<label for="loginPassword">Password:</label> <input type="password" id="loginPassword" name="password" required><br>
			<div class="row"><button id="loginSubmit" type="submit">Login</button> or <a href="#" id="showRegister">Register?</a></div>
		</form>
		<form id="registerForm" hidden>
			<label for="displayname">Display Name:</label> <input type="text" id="displayname" name="displayname" required><br>
			<label for="registerEmail">E-mail:</label> <input type="email" id="registerEmail" name="email" required><br>
			<label for="registerPassword">Password:</label> <input type="password" id="registerPassword" name="password" required><br>
			<div class="row"><button id="registerSubmit" type="submit">Register</button> or <a href="#" id="showLogin">Login?</a></div>
		</form>
	</div>
	<script src="script.js" defer></script>
</body>
</html>

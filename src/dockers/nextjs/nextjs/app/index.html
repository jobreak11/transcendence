<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" name="viewport" content="width=device-width,initial-scale=1" />
<title>Transcend 888 - A 42 Transcendence Project</title>
	<style id="style-normalize" type="text/css">
		html {
			font-family: sans-serif;
			-ms-text-size-adjust: 100%;
			-webkit-text-size-adjust: 100%;
		}
		body {
			margin: 0;
		}
		details,
		canvas,
		header,
		footer,
		main,
		menu,
		nav,
		section,
		summary {
			display: block;
		}
		audio,
		/* audio:not([controls]) {
			display: none;
			height: 0;
		} */
		video {
			display: inline-block;
			vertical-align: baseline;
		}
		a {
			background-color: transparent;
		}
		a:active,
		a:hover {
			outline: 0;
		}
		b,
		strong {
			font-weight: bold;
		}
		dfn {
			font-style: italic;
		}
	</style>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<div class="headerbar">
		<div class="deheader">
			<div class="usertitle">
				<div class="goldfont" style="width: fit-content; max-width: 25vw; padding-left: 8%; font-size: clamp(28px, calc(16px + 2vw), 40px); white-space: normal;" id="textFit">USERNAME</div>
				<div class="goldfont" style="width: fit-content; max-width: 30vw; padding-left: 5%; font-size: clamp(14px, calc(6px + 2vw), 30px); white-space: normal; overflow-wrap: anywhere;">title/alias</div>
			</div>
			<div style="margin-left: auto; "><button style="font-size: clamp(16px, calc(6px + 2vw), 30px);">Play</button></div>
			<div style="margin-left: auto; padding-right: 3%; font-size: clamp(14px, 0.2vw + 1rem, 80%)"><a href="#" id="logout">Logout</a></div>
		</div>
		<div class="bartab">
			<div class="tabcolumn active" data-tab="Main">Main Profile</div>
			<div class="tabcolumn" data-tab="Stat">Player Statistics</div>
			<div class="tabcolumn" data-tab="Hist">Match History</div>
			<div class="tabcolumn" data-tab="Sett">Account Settings</div>
		</div>
	</div>
	<div class="content active" id="Main">
		<div class="blogbox">
			<div style="min-width: 15vw; min-height: 15vw; max-width: 15vw; max-height: 15vw; overflow: hidden;"><img src="profile_sample.png" alt="Profile picture" style="display: block; object-fit: contain; width: 100%; height: 100%;"></div>
			<div style="padding: 1%; display: flex; flex-direction: column;">
				<div>
				<table class="aboutme">
					<tr><td>Join: 03/08/2005</td><td>Level: NaN</td><td>Status: Pending</td></tr>
					<tr><td>Matches Played: NaN</td><td>Rounds Won: NaN</td><td>Win Rate: NaN</td></tr>
				</table><br><hr>
				<div>Signature: Poker Rookie</div>
				</div>
			</div>
		</div>
		<div class="blogbox" style="flex-direction: column;">
			<div style="display: flex;">
				Friends:
				<div class="iconspan"></div>
			</div>
			<div style="display: flex;">
				Trophies:
				<div class="iconspan"></div>
			</div>
		</div>
	</div>
	<div class="content" id="Stat">Player Statistics</div>
	<div class="content" id="Hist">Match History</div>
	<div class="content" id="Sett">Account Settings</div>
	<script src="script.js" defer></script>
</body>
</html>

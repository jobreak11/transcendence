server {
    listen 443 ssl;
    server_name localhost _;

    # Ed25519 TLS Certificate and Private Key
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # TLS Protocols and Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security & Diagnostic Headers sent back to browser
    add_header X-Served-By "Nginx-Reverse-Proxy-Passthrough" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Main application proxy route
    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;

        # Header Passthrough setup for proxy testing
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header X-SSL-Protocol    $ssl_protocol;
        proxy_set_header X-SSL-Cipher      $ssl_cipher;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Buffer settings optimized for proxy testing
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
